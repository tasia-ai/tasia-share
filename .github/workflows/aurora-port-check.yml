name: Aurora multi-screen port validation

on:
  push:
    branches:
      - port/aurora-20261108-multiscreen
      - port/aurora-20261108-latest-check
  workflow_dispatch:

permissions:
  contents: read

jobs:
  patch:
    name: Apply contribution to pinned Aurora main
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout sharing repository
        uses: actions/checkout@v4
        with:
          path: share

      - name: Checkout Aurora at reviewed commit
        uses: actions/checkout@v4
        with:
          repository: Aurora-Viewer/Aurora-Viewer
          ref: 1efb1f9f63c7bfe4bc219d35cdc0e19c87829421
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /crates/aurora-viewer/**
            /crates/aurora-i18n/locales/**
            /Cargo.toml
            /Cargo.lock
            /rustfmt.toml
          path: aurora

      - name: Check patch portability without modifying upstream
        shell: bash
        run: |
          set -euo pipefail
          cd aurora
          git apply --check --verbose ../share/0003-aurora-069f41e-rebased.patch
          git apply ../share/0003-aurora-069f41e-rebased.patch
          git diff --check

      - name: Check Rust syntax and formatting in modified files
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt
          rustfmt --edition 2024 --config-path aurora/rustfmt.toml --config skip_children=true --check \
            aurora/crates/aurora-viewer/src/app.rs \
            aurora/crates/aurora-viewer/src/main.rs \
            aurora/crates/aurora-viewer/src/native_viewports.rs \
            aurora/crates/aurora-viewer/src/settings.rs \
            aurora/crates/aurora-viewer/src/settings/backup.rs \
            aurora/crates/aurora-viewer/src/ui/widgets.rs \
            aurora/crates/aurora-viewer/src/ui/chat/popout.rs \
            aurora/crates/aurora-viewer/src/ui/options/pages/layout.rs \
            aurora/crates/aurora-viewer/src/window_display.rs

      - name: Verify isolated contribution branding
        shell: bash
        run: |
          set -euo pipefail
          if grep -iE '(tasia|marty|fresh-projects|igrid|api[_-]?key\s*=)' share/0003-aurora-069f41e-rebased.patch share/src/*.rs; then
            echo "Unexpected project branding or configuration in code/patches" >&2
            exit 1
          fi

      - name: Checkout full Aurora workspace for compile
        shell: bash
        run: git -C aurora sparse-checkout disable

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev

      - name: Cargo check the rebased viewer
        shell: bash
        run: |
          cd aurora
          cargo check --locked -p aurora-viewer
